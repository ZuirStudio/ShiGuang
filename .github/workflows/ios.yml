name: iOS CI (双轨)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Linux 纯逻辑单测（零 macOS 分钟成本）
  # ------------------------------------------------------------
  # 纪律（AGENTS.md）：EditKit / FaceGeometry 为纯逻辑模块（仅 Foundation，
  # CGFloat/CGPoint 两端可用），必须能在 Linux 秒级编译测试。
  # swift test 会构建整个 package graph，而 RenderKit/AICore/
  # PhotoIO/SystemKit/DesignSystem 均 Apple-only，故此处将这两个 target 的
  # 源码+测试拷贝到隔离 scratch 包，只含纯逻辑目标。
  # ============================================================
  unit-tests:
    name: Unit Tests (Linux, EditKit + FaceGeometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.0.x Hotfix ③：token / secrets 预检（非破坏性）。
      # 仅当显式配置用于推送的 `GH_TOKEN` 且缺少 `repo` 作用域时硬失败
      # （对应手动推送报 403 的根因）；内置 `GITHUB_TOKEN` 仅信息上报，不影响现有绿流。
      - name: Verify token scope (repo)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          check_scope() {
            local token="$1" label="$2" hard="$3"
            [ -z "$token" ] && { echo "• $label: 未配置（跳过）"; return 0; }
            local hdrs
            hdrs=$(curl -s -I -H "Authorization: Bearer $token" https://api.github.com/user 2>/dev/null || true)
            local scopes
            scopes=$(printf '%s\n' "$hdrs" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')
            echo "• $label 作用域: ${scopes:-(空/无响应)}"
            if ! printf '%s' "$scopes" | grep -q "repo"; then
              if [ "$hard" = "1" ]; then
                echo "::error::$label 缺少 repo 作用域（当前: ${scopes:-无}）。用于推送/写权限的令牌必须授予 repo，否则推送将返回 403。"
                return 1
              fi
              echo "• $label 仅信息上报：未含 repo 作用域（如本工作流需推送请补充）。"
              return 0
            fi
            echo "• $label 已具备 repo 作用域 ✓"
          }
          check_scope "$GH_TOKEN" "GH_TOKEN" "1" || exit 1
          check_scope "$GITHUB_TOKEN" "GITHUB_TOKEN" "0"

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Isolate pure-logic targets into scratch package
        run: |
          set -e
          rm -rf /tmp/pure-linux
          mkdir -p /tmp/pure-linux/Sources/EditKit /tmp/pure-linux/Tests/EditKitTests
          mkdir -p /tmp/pure-linux/Sources/FaceGeometry /tmp/pure-linux/Tests/FaceGeometryTests
          mkdir -p /tmp/pure-linux/Sources/AppPipeline /tmp/pure-linux/Tests/AppPipelineTests
          cp ShiGuangKit/Sources/EditKit/*.swift /tmp/pure-linux/Sources/EditKit/
          cp ShiGuangKit/Tests/EditKitTests/*.swift /tmp/pure-linux/Tests/EditKitTests/
          # v1.5.0 Card 1：FaceGeometry 同纪律（纯 Foundation，零 Apple 框架）
          cp ShiGuangKit/Sources/FaceGeometry/*.swift /tmp/pure-linux/Sources/FaceGeometry/
          cp ShiGuangKit/Tests/FaceGeometryTests/*.swift /tmp/pure-linux/Tests/FaceGeometryTests/
          # v1.0.x Hotfix H1：PhotoPipeline 网关 + 一次性装配门（纯 Foundation，
          # 本就与 App/Widget 共享于 Shared/；测试文件存于 Tests/LinuxIsolated，
          # 不经 Xcodegen，避免编进 App/Widget target）
          cp Shared/PhotoPipeline.swift Shared/ServiceInstallGate.swift /tmp/pure-linux/Sources/AppPipeline/
          cp Tests/LinuxIsolated/AppPipelineTests/*.swift /tmp/pure-linux/Tests/AppPipelineTests/
          cat > /tmp/pure-linux/Package.swift <<'EOF'
          // swift-tools-version:6.0
          import PackageDescription

          // 隔离包仅含纯逻辑目标（不声明 platforms：Linux 构建忽略 Apple 平台约束）
          let package = Package(
              name: "PureLogicLinux",
              targets: [
                  .target(name: "EditKit"),
                  .target(name: "FaceGeometry"),
                  .target(name: "AppPipeline"),
                  .testTarget(name: "EditKitTests", dependencies: ["EditKit"]),
                  .testTarget(name: "FaceGeometryTests", dependencies: ["FaceGeometry"]),
                  .testTarget(name: "AppPipelineTests", dependencies: ["AppPipeline"])
              ]
          )
          EOF
          echo "=== 隔离包源码文件数（EditKit / FaceGeometry / AppPipeline）==="
          ls /tmp/pure-linux/Sources/EditKit/*.swift | wc -l
          ls /tmp/pure-linux/Sources/FaceGeometry/*.swift | wc -l
          ls /tmp/pure-linux/Sources/AppPipeline/*.swift | wc -l
          echo "=== 隔离包测试文件数（EditKitTests / FaceGeometryTests / AppPipelineTests）==="
          ls /tmp/pure-linux/Tests/EditKitTests/*.swift | wc -l
          ls /tmp/pure-linux/Tests/FaceGeometryTests/*.swift | wc -l
          ls /tmp/pure-linux/Tests/AppPipelineTests/*.swift | wc -l

      - name: swift test --parallel
        working-directory: /tmp/pure-linux
        run: swift test --parallel

  # ============================================================
  # Job 2: App 构建 + 模拟器截图（唯一 macOS 分钟消耗点）
  # ------------------------------------------------------------
  # 关键适配（与模板的偏离，均有据可查）：
  # 1. macos-latest + plutil 选最新 Xcode —— 部署目标 iOS 27.0，
  #    Xcode 15.4 无 iOS 27 SDK（复刻 ci.yml 已验证路径）。
  # 2. scheme 真名是 ShiGuang（project.yml），非模板猜测的
  #    ShiGuangApp；bundle id = com.shiguang.ShiGuang。
  # 3. 构建前必须 swift Scripts/generate_icon.swift 生成图标
  #    （否则 AssetCatalog 编译失败，ci.yml 同款步骤）。
  # 4. 用 xcodebuild build（ci.yml 验证过）而非 test——
  #    scheme 无 test target，test 是零测试赌博。
  # 5. 构建用 generic/platform=iOS Simulator（ci.yml 验证过）；命名设备
  #    destination 曾在 runner 上解析失败（run 39045609292：OS:latest
  #    匹配不到新建的 iOS 26.5 runtime 设备），故构建与具体设备解耦，
  #    设备（iPhone 15，resolve-or-create）仅用于截图侧 simctl 操作。
  # ============================================================
  build-and-screenshot:
    name: Build + Screenshot
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (need iOS 27 SDK)
        run: |
          set -e
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | while read -r x; do
            v=$(plutil -extract CFBundleShortVersionString raw "$x/Contents/Info.plist" 2>/dev/null || echo 0)
            echo "$v $x"
          done | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$NEWEST" ]; then
            echo "选定 Xcode: $NEWEST"
            echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "未发现 /Applications 下的 Xcode，沿用默认"
          fi
          xcodebuild -version || true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'ShiGuangKit/Package.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Icon (Core Graphics -> 1024x1024 PNG)
        run: |
          set -o pipefail
          swift Scripts/generate_icon.swift \
            --out App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            2>&1 | tee /tmp/icon.log
          ls -l App/Assets.xcassets/AppIcon.appiconset/

      - name: Generate Xcode project
        run: xcodegen generate

      # CI 环境适配：runner 的 Xcode 26.6 附带 iPhoneSimulator26.5.sdk，而
      # 真源配置（project.yml 部署目标 27.0 / Package.swift platforms iOS
      # 27.0）高于该 SDK。CI 工作区内临时把 Package.swift platforms 降到
      # 26.0（不提交、不动真源），配合 Build 步骤的
      # IPHONEOS_DEPLOYMENT_TARGET=26.5 覆盖，使产物可安装到 26.5 模拟器。
      # 真机配置保持 27.0 不变（ci.yml 的 archive/IPA 路径不受影响）。
      # v1.5.0 Card 1：FaceML/Package.swift 同为 27.0 真源，一并临时降级
      # （其依赖的 MediaPipeTasksVision 二进制切片自带更低 platforms，不受影响）。
      - name: Adapt CI deployment target (SDK 26.5)
        run: |
          set -e
          sed -i.bak 's/\.iOS("27.0")/.iOS("26.0")/' ShiGuangKit/Package.swift
          sed -i.bak 's/\.iOS("27.0")/.iOS("26.0")/' FaceML/Package.swift
          echo "=== CI 临时 platforms（ShiGuangKit + FaceML，仅工作区改动不提交）==="
          grep -A3 "platforms" ShiGuangKit/Package.swift | head -5
          grep -A3 "platforms" FaceML/Package.swift | head -5
          echo "=== 临时改动清单（预期：两个 Package.swift；不 commit 不 push）==="
          git diff --stat || true

      - name: Resolve simulator device (iPhone 15 or create)
        id: sim
        run: |
          set -e
          # 事实（run 39048385031/39049393299 取证）：runner 的 Xcode 26.6 附带
          # iPhoneSimulator26.5.sdk，可用 iOS simulator runtime 最高 26.5；
          # xcodebuild -downloadPlatform iOS 无效（26.5 已是最新，秒退）。
          # 部署目标 27.0 高于 SDK 的问题由 Build 步骤的
          # IPHONEOS_DEPLOYMENT_TARGET=26.5 覆盖解决（见下）。
          echo "=== 诊断：可用 iOS runtime ==="
          xcrun simctl list runtimes | grep -i ios || echo "(无 iOS runtime)"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt, devs in d.get('devices', {}).items():
              for dev in devs:
                  if dev.get('name')=='iPhone 15' and dev.get('isAvailable'):
                      print(dev['udid']); sys.exit(0)
          sys.exit(1)
          " ) || UDID=""
          if [ -z "$UDID" ]; then
            echo "iPhone 15 不存在，按最新可用 iOS runtime 创建"
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rs=[(r.get('version','0'), r['identifier']) for r in d['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]
          rs.sort(key=lambda t: [int(x) for x in t[0].split('.')])
          print(rs[-1][1])
          ")
            test -n "$RUNTIME" || { echo "::error::无可用 iOS simulator runtime"; exit 1; }
            echo "选用 runtime: $RUNTIME"
            UDID=$(xcrun simctl create "iPhone 15" "iPhone 15" "$RUNTIME")
          fi
          echo "DEVICE_UDID=$UDID" >> "$GITHUB_ENV"
          echo "iPhone 15 UDID: $UDID"
          xcrun simctl list devices available | grep -F "iPhone 15" | head -3

      # 构建用 generic destination：R007d 起 ci.yml 的 app-build 在 macOS runner
      # 上多次验证可用；命名设备（name=iPhone 15）在 xcodebuild destination
      # 解析上曾失败（run 39045609292：OS:latest 匹配不到新建的 iOS 26.5
      # runtime 设备），故构建与具体设备解耦，设备仅用于截图侧 simctl。
      # IPHONEOS_DEPLOYMENT_TARGET=26.5 覆盖：project.yml 的真机部署目标
      # 27.0 高于 runner 的 Xcode 26.6 SDK（iPhoneSimulator26.5.sdk），
      # 产物 MinimumOSVersion 27.0 会被模拟器 installd 拒绝
      # （run 39048385031/39049393299: "拾光 Requires a Newer Version of
      # iOS; Have 26.5; need 27.0"）。仅 CI 覆盖，不动真机产品配置；
      # 若代码有 iOS 27-only API，build 会在本步报错，届时按报错清单处理。
      - name: Build (unsigned, simulator generic destination)
        run: |
          set -o pipefail
          xcodebuild \
            -project ShiGuang.xcodeproj \
            -scheme ShiGuang \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath /tmp/test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=26.5 \
            build 2>&1 | tee /tmp/build.log

      - name: Extract build errors from xcresult
        if: failure()
        run: |
          if [ -d /tmp/test.xcresult ]; then
            echo "=== 错误摘要（xcrun xcresulttool）==="
            xcrun xcresulttool get --path /tmp/test.xcresult --format json > /tmp/xcresult.json 2>/dev/null || true
            python3 - <<'PY' || true
          import json
          try:
              data = json.load(open('/tmp/xcresult.json'))
              errs = data.get('error', {})
              print(json.dumps(errs, ensure_ascii=False)[:4000])
          except Exception as e:
              print('(xcresult 解析跳过:', e, ')')
          PY
            echo "=== 编译错误行（build.log 过滤）==="
            grep -E "error:|Error:|FAILED| fatalError" /tmp/build.log | head -40 || true
          else
            echo "(无 xcresult，仅 build.log)"
            grep -E "error:|FAILED" /tmp/build.log | head -40 || true
          fi

      - name: Boot simulator + install app
        run: |
          set -e
          test -n "$DEVICE_UDID" || { echo "::error::DEVICE_UDID 未设置"; exit 1; }
          echo "=== 诊断：设备状态与 OS 版本 ==="
          xcrun simctl list devices -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt, devs in d.get('devices', {}).items():
              for dev in devs:
                  if dev.get('udid')=='$DEVICE_UDID':
                      print('runtime:', rt, '| OS:', dev.get('os_version','?'), '| state:', dev.get('state'))
          "
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          # 首启 SwiftUI 渲染留时间；状态栏打补丁保证截图稳定
          sleep 6
          xcrun simctl status_bar "$DEVICE_UDID" override --time 9:41 --batteryLevel 100 --batteryState charged --wifiBars 3 --cellularBars 4
          APP="build/Build/Products/Debug-iphonesimulator/ShiGuang.app"
          test -d "$APP" || { echo "::error::构建产物缺失: $APP"; ls -l build/Build/Products/ 2>/dev/null; exit 1; }
          xcrun simctl install booted "$APP"
          # 启动前授予照片权限，避免权限弹窗污染截图（需 app 已安装才生效）
          xcrun simctl privacy grant photos com.shiguang.ShiGuang 2>/dev/null || true

      # R010：截图分四次启动采集。每次 launch 前先 terminate ——
      # 已前台运行的 App 不会以新的深链参数重启（simctl launch 不重启进程）。
      # AGENTS.md 纪律：先看截图再改代码 —— 历史面板 / 批量多选 /
      # 批量配置 / 批量进行中 + 结果，五个 UI 态全覆盖。

      # 渲染就绪探测工具（v1.5.0 Card 1 起所有截图步骤共用）：
      # /tmp/render_probe.py = Python stdlib PNG luma 解码器（零第三方依赖）；
      # /tmp/render_probe.sh = probe_render 轮询函数（截图→缩 64px→算亮度，
      # 非黑(>=3)才算 UI 渲染完成，超时返回 1 由调用步骤显式失败）。
      - name: Install render probe (PNG luma decoder + poll helper)
        run: |
          set -e
          echo "python3: $(command -v python3 || echo MISSING)"
          cat > /tmp/render_probe.py <<'PY'
          import zlib, struct, sys

          def decode_luma(path):
              d = open(path, 'rb').read()
              if d[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError('not PNG')
              pos = 8
              idat = b''
              w = h = bd = ct = None
              while pos + 8 <= len(d):
                  ln = struct.unpack_from('>I', d, pos)[0]
                  typ = d[pos+4:pos+8]
                  chunk = d[pos+8:pos+8+ln]
                  pos += 12 + ln
                  if typ == b'IHDR':
                      w, h, bd, ct = struct.unpack_from('>IIBB', chunk, 0)
                  elif typ == b'IDAT':
                      idat += chunk
                  elif typ == b'IEND':
                      break
              if bd != 8:
                  raise ValueError('bit depth %d' % bd)
              ch = {0: 1, 2: 3, 4: 2, 6: 4}.get(ct)
              if ch is None:
                  raise ValueError('color type %d' % ct)
              raw = zlib.decompress(idat)
              stride = w * ch
              prev = bytearray(stride)
              rows = []
              p = 0
              for y in range(h):
                  f = raw[p]; p += 1
                  line = bytearray(raw[p:p+stride]); p += stride
                  if f == 1:
                      for i in range(ch, stride):
                          line[i] = (line[i] + line[i-ch]) & 255
                  elif f == 2:
                      for i in range(stride):
                          line[i] = (line[i] + prev[i]) & 255
                  elif f == 3:
                      for i in range(stride):
                          a = line[i-ch] if i >= ch else 0
                          line[i] = (line[i] + ((a + prev[i]) >> 1)) & 255
                  elif f == 4:
                      for i in range(stride):
                          a = line[i-ch] if i >= ch else 0
                          b = prev[i]
                          c = line[i-ch] if i >= ch else 0
                          pa = abs(b-c); pb = abs(a-c); pc = abs(a+b-2*c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          line[i] = (line[i] + pr) & 255
                  elif f != 0:
                      raise ValueError('filter %d' % f)
                  rows.append(line)
                  prev = line
              tot = 0
              n = 0
              for y in range(h):
                  row = rows[y]
                  for x in range(w):
                      i = x * ch
                      if ct == 0 or ct == 4:
                          r = g = b = row[i]
                      else:
                          r = row[i]; g = row[i+1]; b = row[i+2]
                      tot += (r*299 + g*587 + b*114) // 1000
                      n += 1
              return tot // max(n, 1)

          try:
              print(decode_luma(sys.argv[1]))
          except Exception as e:
              print('PROBE_ERR: %s' % e, file=sys.stderr)
              print(-2)
          PY
          cat > /tmp/render_probe.sh <<'SH'
          # 轮询直到小图平均亮度 >= 3（非纯黑）；0=已渲染 1=超时仍黑
          probe_render() {
            local out="$1" tries="$2" i mean
            for i in $(seq 1 "$tries"); do
              xcrun simctl io booted screenshot "$out"
              rm -f /tmp/_render_probe.png
              sips -Z 64 "$out" --out /tmp/_render_probe.png >/tmp/sips.log 2>&1 || true
              if [ ! -s /tmp/_render_probe.png ]; then
                echo "  探测 #$i：sips 未产出小图（$(tail -1 /tmp/sips.log 2>/dev/null)）"
                sleep 1
                continue
              fi
              mean=$(python3 /tmp/render_probe.py /tmp/_render_probe.png || true)
              echo "  探测 #$i：mean=${mean} size=$(stat -f%z /tmp/_render_probe.png 2>/dev/null || echo '?')"
              if [ "${mean:-0}" -ge 3 ]; then return 0; fi
              sleep 1
            done
            return 1
          }
          SH
          echo "probe installed: $(ls -l /tmp/render_probe.py /tmp/render_probe.sh | wc -l) files"

      - name: Capture screenshot — history panel (R010)
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotHistoryPanel
          echo "=== 等待编辑器首帧 + 预览渲染 + 历史面板弹出 ==="
          sleep 9
          xcrun simctl io booted screenshot /tmp/screenshot-history-raw.png
          sips -Z 1800 /tmp/screenshot-history-raw.png --out /tmp/screenshot-history-1800.png
          ls -lh /tmp/screenshot-history-1800.png

      - name: Capture screenshot — batch multi-select (R010)
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotBatch:select
          echo "=== 等待演示照片落库 + 多选态 + 底部批量条 ==="
          sleep 8
          xcrun simctl io booted screenshot /tmp/screenshot-batch-select-raw.png
          sips -Z 1800 /tmp/screenshot-batch-select-raw.png --out /tmp/screenshot-batch-select-1800.png
          ls -lh /tmp/screenshot-batch-select-1800.png

      - name: Capture screenshot — batch config (R010)
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotBatch:config
          echo "=== 等待批量面板配置态（照片条 + 预设列表）==="
          sleep 8
          xcrun simctl io booted screenshot /tmp/screenshot-batch-config-raw.png
          sips -Z 1800 /tmp/screenshot-batch-config-raw.png --out /tmp/screenshot-batch-config-1800.png
          ls -lh /tmp/screenshot-batch-config-1800.png

      - name: "Capture screenshot — batch run: progress + result (R011)"
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotBatch:run
          echo "=== 批量面板自动开跑（先捕进度态；种子已顶补为 8 张，无主线程播种阻塞）==="
          # R011 修复进度态黑屏：旧逻辑固定 sleep 4 后直接采集，SwiftUI 首帧
          # 尚未渲染出内容即截图 → 得到全黑图（v0.8.0 CI 5 态截图中唯一黑屏）。
          # 新策略：8s 基础等待 + 屏幕亮度轮询闭环——sips 缩到 64px 小图，
          # Python stdlib（zlib）纯解 PNG 算全图平均亮度，非黑(>=3)才算 UI
          # 渲染完成；仍黑则续等续试；超时显式 ::error 失败，不再上传黑图。
          # （recordVideo 备选未采用：视频需抽帧；小图 PNG 解码直接验证目标
          # 现象且零第三方依赖，不赌 sips 的 BMP 位深与 PIL 可用性。）
          sleep 8
          # 亮度探测脚本与 probe_render 函数由前置步骤安装（见 Install render probe）
          source /tmp/render_probe.sh
          if probe_render /tmp/screenshot-batch-progress-raw.png 10; then
            echo "进度态 UI 已渲染（亮度闭环确认非黑）"
          else
            echo "::error::批量进度态截图连续探测均为黑屏，UI 未渲染"
            exit 1
          fi
          sips -Z 1800 /tmp/screenshot-batch-progress-raw.png --out /tmp/screenshot-batch-progress-1800.png
          ls -lh /tmp/screenshot-batch-progress-1800.png
          echo "=== 继续等待批量处理完成（捕结果态；8 张实测约 10s，留 2 倍余量）==="
          sleep 18
          xcrun simctl io booted screenshot /tmp/screenshot-batch-done-raw.png
          sips -Z 1800 /tmp/screenshot-batch-done-raw.png --out /tmp/screenshot-batch-done-1800.png
          ls -lh /tmp/screenshot-batch-done-1800.png


      # v1.5.0 Card 1：人脸几何调试面板双轨截图（验收 Provider 切换）。
      # 深链 -ShiGuangScreenshotFaceGeometry:mediapipe 强制 MediaPipe 主路径
      # （面板内若启动注册未完成会主动 warmUp，不依赖启动时序）；
      # :vision 强制兜底轨。同一演示图两条轨的槽位覆盖率 / 虹膜 / 位姿差异
      # 一图可见（MediaPipe 468+10 vs Vision 152+0）。
      - name: "Capture screenshot — face geometry: MediaPipe (v1.5.0 Card 1)"
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotFaceGeometry:mediapipe
          echo "=== 等待人脸几何面板 + MediaPipe 检测（模型加载/478 点/网格渲染）==="
          sleep 9
          source /tmp/render_probe.sh
          if probe_render /tmp/screenshot-face-mediapipe-raw.png 10; then
            echo "人脸几何面板 UI 已渲染（亮度闭环确认非黑）"
          else
            echo "::error::人脸几何（MediaPipe）截图连续探测均为黑屏，UI 未渲染"
            exit 1
          fi
          sips -Z 1800 /tmp/screenshot-face-mediapipe-raw.png --out /tmp/screenshot-face-mediapipe-1800.png
          ls -lh /tmp/screenshot-face-mediapipe-1800.png

      - name: "Capture screenshot — face geometry: Vision fallback (v1.5.0 Card 1)"
        run: |
          set -e
          xcrun simctl terminate booted com.shiguang.ShiGuang 2>/dev/null || true
          xcrun simctl launch booted com.shiguang.ShiGuang -ShiGuangScreenshotFaceGeometry:vision
          echo "=== 等待人脸几何面板 + Vision 兜底检测（152 外壳槽位/无虹膜）==="
          sleep 9
          source /tmp/render_probe.sh
          if probe_render /tmp/screenshot-face-vision-raw.png 10; then
            echo "人脸几何面板 UI 已渲染（亮度闭环确认非黑）"
          else
            echo "::error::人脸几何（Vision）截图连续探测均为黑屏，UI 未渲染"
            exit 1
          fi
          sips -Z 1800 /tmp/screenshot-face-vision-raw.png --out /tmp/screenshot-face-vision-1800.png
          ls -lh /tmp/screenshot-face-vision-1800.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: |
            /tmp/screenshot-history-1800.png
            /tmp/screenshot-batch-select-1800.png
            /tmp/screenshot-batch-config-1800.png
            /tmp/screenshot-batch-progress-1800.png
            /tmp/screenshot-batch-done-1800.png
            /tmp/screenshot-face-mediapipe-1800.png
            /tmp/screenshot-face-vision-1800.png
            /tmp/screenshot-history-raw.png
            /tmp/screenshot-batch-select-raw.png
            /tmp/screenshot-batch-config-raw.png
            /tmp/screenshot-batch-progress-raw.png
            /tmp/screenshot-batch-done-raw.png
            /tmp/screenshot-face-mediapipe-raw.png
            /tmp/screenshot-face-vision-raw.png
          retention-days: 2

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/icon.log
          retention-days: 2

  # ============================================================
  # Job 3: 人工调试 SSH（workflow_dispatch 触发，tmate 会话）
  # ============================================================
  debug-ssh:
    name: Debug SSH (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
