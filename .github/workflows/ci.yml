name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Job 1：纯逻辑单测 — 无需模拟器，macOS 宿主直接跑（ADR-007）
  unit-tests:
    name: Unit Tests (EditKit + RenderKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain version
        run: |
          swift --version
          xcodebuild -version

      - name: Run package tests
        working-directory: ShiGuangKit
        run: |
          set -o pipefail
          # R009-Fix-诊断：完整捕获测试输出（含 Swift Testing 的 issue 详情），
          # 失败时以产物形式保留 —— logs API 对非 admin 令牌 403，产物任何令牌可下载
          swift test 2>&1 | tee /tmp/test-output.txt

      - name: Upload test output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt
          retention-days: 7

  # Job 2：App target 构建（iOS 27 SDK，免签名）
  app-build:
    name: App Build (iOS 27)
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version check
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          # 若 runner 默认 Xcode < 27，在此 pin DEVELOPER_DIR 到 Xcode 27 的路径

      - name: Select newest Xcode (need iOS 27 SDK)
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | while read -r x; do
            v=$(plutil -extract CFBundleShortVersionString raw "$x/Contents/Info.plist" 2>/dev/null || echo 0)
            echo "$v $x"
          done | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$NEWEST" ]; then
            echo "选定 Xcode: $NEWEST"
            echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "未发现 /Applications 下的 Xcode，沿用默认"
          fi
          xcodebuild -version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Icon (Core Graphics -> 1024x1024 PNG)
        run: |
          set -o pipefail
          swift Scripts/generate_icon.swift \
            --out App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            2>&1 | tee /tmp/icon.log
          ls -l App/Assets.xcassets/AppIcon.appiconset/

      - name: Upload generated app icon
        uses: actions/upload-artifact@v4
        with:
          name: app-icon-1024
          path: App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator generic destination)
        run: |
          set -o pipefail
          # ARCHS=arm64：MediaPipeTasksVision xcframework 仅含 ios-arm64 + ios-arm64-simulator
          # 切片（无 x86_64 模拟器切片）；generic simulator destination 默认按 ARCHS_STANDARD
          # 同时编 arm64+x86_64，x86_64 侧会 ld: ignoring 掉全部 MediaPipe 框架 → 链接失败。
          # macOS runner 为 Apple Silicon，arm64 模拟器原生可跑，故强制 arm64。
          xcodebuild \
            -project ShiGuang.xcodeproj \
            -scheme ShiGuang \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build 2>&1 | tee /tmp/build.log

      - name: Verify Assets.car in built app bundle
        run: |
          set -e
          APP="build/Build/Products/Debug-iphonesimulator/ShiGuang.app"
          echo "=== app bundle 顶层 ==="
          ls -l "$APP"
          test -f "$APP/Assets.car" || { echo "::error::构建产物缺少 Assets.car"; exit 1; }
          echo "Assets.car: $(stat -f%z "$APP/Assets.car") bytes"
          xcrun --sdk iphonesimulator assetutil --info "$APP/Assets.car" > /tmp/car.json 2>/dev/null || true
          echo "=== Assets.car 内 AppIcon 条目 ==="
          if grep -qi 'appicon' /tmp/car.json; then
            grep -i 'appicon' /tmp/car.json | head -8
          else
            echo "::warning::Assets.car 中未找到 AppIcon 条目"
            head -c 400 /tmp/car.json || true
          fi

  # Job 3：未签名 IPA（tag 触发）— 侧载用
  unsigned-ipa:
    # 创建 Release 需要写权限；默认 GITHUB_TOKEN 只读 → softprops/action-gh-release 会 403
    permissions:
      contents: write
    name: Unsigned IPA
    runs-on: macos-latest
    needs: app-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (need iOS 27 SDK)
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | while read -r x; do
            v=$(plutil -extract CFBundleShortVersionString raw "$x/Contents/Info.plist" 2>/dev/null || echo 0)
            echo "$v $x"
          done | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$NEWEST" ]; then
            echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Icon (Core Graphics -> 1024x1024 PNG)
        run: |
          set -o pipefail
          swift Scripts/generate_icon.swift \
            --out App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            2>&1 | tee /tmp/icon.log
          ls -l App/Assets.xcassets/AppIcon.appiconset/

      - name: Verify appiconset manifest
        run: |
          test -f App/Assets.xcassets/AppIcon.appiconset/Contents.json
          python3 -c "import json;c=json.load(open('App/Assets.xcassets/AppIcon.appiconset/Contents.json'));print('appiconset OK:',c['images'][0])"

      - name: Generate project
        run: xcodegen generate

      - name: Verify version matches tag
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(python3 -c "import re;print(re.search(r'CFBundleShortVersionString: \"([^\"]+)\"', open('project.yml').read()).group(1))")
          echo "tag=$TAG project.yml=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::project.yml 版本($ACTUAL) 与 tag($TAG) 不一致"; exit 1; }
          echo "IPA=ShiGuang-${TAG}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          # R009-Fix：标准 Apple 流程 —— 真实 iOS 目标（generic/platform=iOS）构建 Archive。
          # CI runner 无签名证书：主路径（不显式禁用签名）若失败，
          # 回退到禁用签名重试。unsigned IPA 由侧载工具自行重签，
          # 禁用签名不改变 .app 结构，只影响是否携带签名。
          if ! xcodebuild \
            -project ShiGuang.xcodeproj \
            -scheme ShiGuang \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/ShiGuang.xcarchive \
            archive 2>&1 | tee /tmp/archive.log; then
            echo "::warning::主路径 archive 失败（runner 无签名证书），回退禁用签名重试"
            rm -rf build/ShiGuang.xcarchive
            xcodebuild \
              -project ShiGuang.xcodeproj \
              -scheme ShiGuang \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -archivePath build/ShiGuang.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              archive 2>&1 | tee /tmp/archive-fallback.log
          fi
          test -d build/ShiGuang.xcarchive/Products/Applications/ShiGuang.app \
            || { echo "::error::Archive 内缺少 Products/Applications/ShiGuang.app"; exit 1; }

      - name: Package unsigned IPA
        run: |
          set -e
          # R009-Fix：严格按标准流程组包 —— Archive 提取 .app → Payload → zip -qry
          # （-y 保留符号链接权限；zip 从 build/ 内执行，保证 IPA 内层级为
          #   Payload/ShiGuang.app/... 而非嵌套 build/Payload/...）
          mkdir -p build/Payload
          cp -R build/ShiGuang.xcarchive/Products/Applications/ShiGuang.app build/Payload/
          cd build
          zip -qry "$IPA" Payload
          cd ..
          ls -lh "build/$IPA"

      - name: Verify IPA structure (Payload/ShiGuang.app/Info.plist)
        run: |
          set -e
          # R009-Fix：Error 302「Unable to locate Info.plist」防线 ——
          # 侧载工具要求的权威结构：Payload/<App>.app/Info.plist 且真机 arm64。
          echo "=== IPA 内结构（前 20 条）==="
          unzip -l "build/$IPA" | head -20
          echo "=== Info.plist 必须在 Payload/ShiGuang.app/ 下 ==="
          unzip -l "build/$IPA" | grep -E "Payload/ShiGuang\.app/Info\.plist" \
            || { echo "::error::IPA 缺少 Payload/ShiGuang.app/Info.plist（侧载工具会报 Error 302）"; exit 1; }
          APP="build/ShiGuang.xcarchive/Products/Applications/ShiGuang.app"
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "=== 可执行文件架构（$EXEC，必须 arm64 真机）==="
          lipo -info "$APP/$EXEC"
          lipo -info "$APP/$EXEC" | grep -q arm64 \
            || { echo "::error::架构非 arm64（疑似模拟器产物，侧载工具会拒绝）"; exit 1; }
          echo "=== 版本（权威：Archive 内 Info.plist）==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"

      - name: Verify Assets.car (app bundle + IPA)
        run: |
          set -e
          APP="build/ShiGuang.xcarchive/Products/Applications/ShiGuang.app"
          echo "=== app bundle 顶层 ==="
          ls -l "$APP"
          test -f "$APP/Assets.car" || { echo "::error::app bundle 内缺少 Assets.car"; exit 1; }
          echo "Assets.car 大小: $(stat -f%z "$APP/Assets.car") bytes"
          echo "=== IPA 内 Assets.car ==="
          unzip -l "build/$IPA" | grep -i 'Assets.car' \
            || { echo "::error::IPA 内缺少 Payload/ShiGuang.app/Assets.car"; exit 1; }
          echo "=== Assets.car 内图标条目（信息性）==="
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" 2>/dev/null \
            | grep -i 'appicon' | head -20 || true
          echo "=== Info.plist 图标键（信息性）==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" 2>/dev/null || echo "(无 CFBundleIcons)"
          echo "=== IPA 字节数（v0.4.0 基线 430609 / v0.5.0 基线 895563）==="
          stat -f%z "build/$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiGuang-unsigned-ipa
          path: build/${{ env.IPA }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.IPA }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
