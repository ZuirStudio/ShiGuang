name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Job 1：纯逻辑单测 — 无需模拟器，macOS 宿主直接跑（ADR-007）
  unit-tests:
    name: Unit Tests (EditKit + RenderKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain version
        run: |
          swift --version
          xcodebuild -version

      - name: Run package tests
        working-directory: ShiGuangKit
        run: swift test

  # Job 2：App target 构建（iOS 27 SDK，免签名）
  app-build:
    name: App Build (iOS 27)
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version check
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          # 若 runner 默认 Xcode < 27，在此 pin DEVELOPER_DIR 到 Xcode 27 的路径

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator generic destination)
        run: |
          set -o pipefail
          xcodebuild \
            -project ShiGuang.xcodeproj \
            -scheme ShiGuang \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -60

  # Job 3：未签名 IPA（开源分发 — TrollStore / AltStore / Sideloadly 侧载用）
  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShiGuang.xcodeproj \
            -scheme ShiGuang \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiGuang.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_COMPILATION_MODE=wholemodule \
            2>&1 | tail -40

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/ShiGuang.xcarchive/Products/Applications/ShiGuang.app" build/Payload/
          cd build && zip -qry ShiGuang-unsigned.ipa Payload
          ls -lh ShiGuang-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiGuang-unsigned-ipa
          path: build/ShiGuang-unsigned.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ShiGuang-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
