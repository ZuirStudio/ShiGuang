name: ShiGuang
# XcodeGen 配置 — 本文件是工程唯一真源；ShiGuang.xcodeproj 由 `xcodegen generate` 生成且不入库
options:
  bundleIdPrefix: com.shiguang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"

packages:
  ShiGuangKit:
    path: ShiGuangKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  ShiGuang:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ShiGuangKit
        product: EditKit
      - package: ShiGuangKit
        product: RenderKit
      - package: ShiGuangKit
        product: AICore
      - package: ShiGuangKit
        product: BYOKCloud
      - package: ShiGuangKit
        product: PhotoIO
      - package: ShiGuangKit
        product: SystemKit
      - package: ShiGuangKit
        product: DesignSystem
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 拾光
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 权限说明（合规 A6）：仅导入场景使用，照片不离开设备
        NSPhotoLibraryUsageDescription: 拾光需要访问照片库，仅用于导入你要编辑的照片。照片仅在你的设备本地处理，未经你的明确操作绝不上传。
        ITSAppUsesNonExemptEncryption: false

schemes:
  ShiGuang:
    build:
      targets:
        ShiGuang: all
    run:
      config: Debug
    test:
      config: Debug
